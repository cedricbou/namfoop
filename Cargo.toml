[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
jack = "0.14"
rtrb = "0.4"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"
alsa = "0.12"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

# Profil des vérifications automatiques (CI, NAMFOOP_PROFILE=ci) : optimisé comme release mais sans
# LTO, compilation parallèle, assertions de debug actives (assert_no_alloc). Partagé par les tests et
# le binaire utilisé pour les docs / rendus : une seule compilation. Le binaire de scène reste `release`.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
debug-assertions = true
panic = "unwind"
incremental = false
